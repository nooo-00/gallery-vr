<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>EAST×EAST Gallery VR</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:none}#v{position:fixed;inset:0;width:100%;height:100%;background:#181818}.hud{position:fixed;z-index:5;left:12px;top:12px;padding:9px 11px;border-radius:12px;background:rgba(15,15,18,.72);border:1px solid rgba(255,255,255,.18);font-size:12px;line-height:1.45;backdrop-filter:blur(10px)}.tools{position:fixed;z-index:6;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:55vw}button{border:1px solid rgba(255,255,255,.2);background:rgba(15,15,18,.72);color:#fff;padding:8px 10px;border-radius:10px}.bar{position:fixed;z-index:6;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px;padding:6px;border-radius:13px;background:rgba(15,15,18,.72);border:1px solid rgba(255,255,255,.18)}#joy{position:fixed;z-index:7;left:18px;bottom:86px;width:116px;height:116px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(20,20,20,.25)}#stick{position:absolute;width:48px;height:48px;left:34px;top:34px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32)}#map{position:fixed;z-index:5;right:12px;bottom:76px;width:150px;height:140px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(10,10,12,.8)}#cross{position:fixed;z-index:4;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);pointer-events:none;opacity:.5}#cross:before,#cross:after{content:"";position:absolute;background:#fff}#cross:before{width:14px;height:1px;top:6.5px}#cross:after{height:14px;width:1px;left:6.5px}@media(pointer:fine){#joy{display:none}}</style></head><body><canvas id="v"></canvas><canvas id="map"></canvas><div class="hud"><b>EAST×EAST 1인칭 공간 체험</b><br>키 163cm 기준 · 눈높이 약 153cm<br><span id="status">렌더러 시작 중…</span></div><div class="tools"><button id="reset">입구</button><button id="grid">그리드</button><button id="mapBtn">미니맵</button></div><div class="bar"><button data-p="A">A벽</button><button data-p="B">B벽</button><button data-p="C">C벽</button><button data-p="center">중앙</button></div><div id="joy"><div id="stick"></div></div><div id="cross"></div><script>(()=>{'use strict';const c=document.getElementById('v'),x=c.getContext('2d'),m=document.getElementById('map'),mx=m.getContext('2d'),s=document.getElementById('status');if(!x){s.textContent='Canvas를 지원하지 않는 브라우저입니다.';return}s.textContent='렌더러 실행됨';const H=1.53,FOV=72*Math.PI/180;const room=[{x:0,y:0},{x:0,y:3.024},{x:3.193,y:3.024},{x:3.48,y:2.10},{x:3.26,y:.42},{x:2.82,y:.42},{x:2.82,y:.02},{x:.34,y:.02},{x:.34,y:.24},{x:0,y:.24}],storage=[{x:2.53,y:3.024},{x:3.193,y:3.024},{x:3.48,y:2.10},{x:2.86,y:2.30},{x:2.53,y:2.44}];const walls=[];const add=(a,b,n,h=2.32)=>walls.push({a,b,n,h});add(room[0],room[1],'A',2.248);add(room[1],room[2],'B',2.395);add(room[2],room[3],'C',2.30);add(room[3],room[4],'C',2.30);add(room[4],room[5],'C',2.25);add(room[5],room[6],'입구 우측',2.25);add(room[7],room[8],'입구 좌측',2.25);add(room[8],room[9],'입구 좌측',2.25);add(room[9],room[0],'A',2.248);add({x:.34,y:.02},{x:.88,y:.02},'입구 좌측',2.2);add({x:2.36,y:.02},{x:2.82,y:.02},'입구 우측',2.2);for(let i=0;i<storage.length;i++){if(i===0)continue;add(storage[i],storage[(i+1)%storage.length],'Storage',2.25)}const cam={x:1.58,y:.48,yaw:Math.PI/2,pitch:0};const presets={A:{x:1.25,y:1.45,yaw:Math.PI},B:{x:1.55,y:1.25,yaw:Math.PI/2},C:{x:2.05,y:1.45,yaw:.15},center:{x:1.55,y:1.62,yaw:.95}};let grid=true,mapOn=true,joy={x:0,y:0},last=performance.now();function resize(){const d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(d,0,0,d,0,0);m.width=m.clientWidth*d;m.height=m.clientHeight*d;mx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function inside(p,poly){let q=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let a=poly[i],b=poly[j];if(((a.y>p.y)!=(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x))q=!q}return q}function dseg(px,py,a,b){let vx=b.x-a.x,vy=b.y-a.y,t=((px-a.x)*vx+(py-a.y)*vy)/(vx*vx+vy*vy);t=Math.max(0,Math.min(1,t));return Math.hypot(px-(a.x+t*vx),py-(a.y+t*vy))}function ok(px,py){if(!inside({x:px,y:py},room)||inside({x:px,y:py},storage))return false;for(const w of walls)if(dseg(px,py,w.a,w.b)<.12)return false;return true}function hit(ox,oy,dx,dy,a,b){let sx=b.x-a.x,sy=b.y-a.y,det=-dx*sy+dy*sx;if(Math.abs(det)<1e-9)return null;let u=(-sy*(a.x-ox)+sx*(a.y-oy))/det,t=(dx*(a.y-oy)-dy*(a.x-ox))/det;return u>0&&t>=0&&t<=1?{d:u,t}:null}function render(){const W=innerWidth,HH=innerHeight,hor=HH/2+cam.pitch*HH*.4;let g=x.createLinearGradient(0,0,0,hor);g.addColorStop(0,'#96918b');g.addColorStop(1,'#c7c2ba');x.fillStyle=g;x.fillRect(0,0,W,hor);g=x.createLinearGradient(0,hor,0,HH);g.addColorStop(0,'#77736e');g.addColorStop(1,'#4c4946');x.fillStyle=g;x.fillRect(0,hor,W,HH-hor);const f=(W/2)/Math.tan(FOV/2),step=Math.max(1,Math.floor(W/900));for(let sx=0;sx<W;sx+=step){let ang=cam.yaw+Math.atan((sx-W/2)/f),dx=Math.cos(ang),dy=Math.sin(ang),best=null,bw=null;for(const w of walls){let h=hit(cam.x,cam.y,dx,dy,w.a,w.b);if(h&&(!best||h.d<best.d)){best=h;bw=w}}if(!best)continue;let dist=best.d*Math.cos(ang-cam.yaw),wh=bw.h/dist*f,bot=hor+H/dist*f,top=bot-wh,base=bw.n==='B'?245:bw.n==='A'?238:bw.n==='C'?231:218,shade=Math.max(.38,Math.min(1,1-dist/8));let v=Math.round(base*shade);x.fillStyle=`rgb(${v},${v},${Math.max(0,v-3)})`;x.fillRect(sx,top,step+1,wh)}if(grid)drawGrid(f,hor,W)}function proj(px,py,f,hor,W){let dx=px-cam.x,dy=py-cam.y,fr=dx*Math.cos(cam.yaw)+dy*Math.sin(cam.yaw),rt=-dx*Math.sin(cam.yaw)+dy*Math.cos(cam.yaw);if(fr<=.05)return null;return{x:W/2+rt/fr*f,y:hor+H/fr*f}}function line(a,b,f,hor,W){let pa=proj(a.x,a.y,f,hor,W),pb=proj(b.x,b.y,f,hor,W);if(!pa||!pb)return;x.beginPath();x.moveTo(pa.x,pa.y);x.lineTo(pb.x,pb.y);x.stroke()}function drawGrid(f,hor,W){x.save();x.strokeStyle='rgba(255,255,255,.11)';x.lineWidth=1;for(let gx=0;gx<=3.5;gx+=.5)line({x:gx,y:.25},{x:gx,y:3.0},f,hor,W);for(let gy=.5;gy<=3;gy+=.5)line({x:.05,y:gy},{x:3.4,y:gy},f,hor,W);x.restore()}function drawMap(){m.style.display=mapOn?'block':'none';if(!mapOn)return;const W=m.clientWidth,HH=m.clientHeight;mx.clearRect(0,0,W,HH);mx.fillStyle='rgba(10,10,12,.9)';mx.fillRect(0,0,W,HH);const sc=Math.min((W-20)/3.7,(HH-20)/3.25),P=p=>({x:10+p.x*sc,y:HH-10-p.y*sc});mx.strokeStyle='#ddd';mx.lineWidth=2;mx.beginPath();room.forEach((p,i)=>{let q=P(p);i?mx.lineTo(q.x,q.y):mx.moveTo(q.x,q.y)});mx.closePath();mx.stroke();mx.fillStyle='rgba(150,150,150,.35)';mx.beginPath();storage.forEach((p,i)=>{let q=P(p);i?mx.lineTo(q.x,q.y):mx.moveTo(q.x,q.y)});mx.closePath();mx.fill();let q=P(cam);mx.fillStyle='#ffd36a';mx.beginPath();mx.arc(q.x,q.y,5,0,Math.PI*2);mx.fill();mx.strokeStyle='#ffd36a';mx.beginPath();mx.moveTo(q.x,q.y);mx.lineTo(q.x+Math.cos(cam.yaw)*18,q.y-Math.sin(cam.yaw)*18);mx.stroke()}function update(dt){let f=-joy.y,r=joy.x,mag=Math.hypot(f,r);if(mag>1){f/=mag;r/=mag}let sp=1.0*dt,dx=(Math.cos(cam.yaw)*f+Math.cos(cam.yaw+Math.PI/2)*r)*sp,dy=(Math.sin(cam.yaw)*f+Math.sin(cam.yaw+Math.PI/2)*r)*sp;if(ok(cam.x+dx,cam.y))cam.x+=dx;if(ok(cam.x,cam.y+dy))cam.y+=dy;s.textContent=`위치 ${cam.x.toFixed(2)}m × ${cam.y.toFixed(2)}m`}function loop(t){let dt=Math.min(.05,(t-last)/1000);last=t;update(dt);render();drawMap();requestAnimationFrame(loop)}requestAnimationFrame(loop);let look=false,lx=0,ly=0;c.addEventListener('pointerdown',e=>{if(e.clientX<170&&e.clientY>innerHeight-240)return;look=true;lx=e.clientX;ly=e.clientY;try{c.setPointerCapture(e.pointerId)}catch{}e.preventDefault()},{passive:false});c.addEventListener('pointermove',e=>{if(!look)return;cam.yaw+=(e.clientX-lx)*.006;cam.pitch=Math.max(-.5,Math.min(.5,cam.pitch-(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY;e.preventDefault()},{passive:false});['pointerup','pointercancel'].forEach(k=>c.addEventListener(k,()=>look=false,{passive:false}));const j=document.getElementById('joy'),st=document.getElementById('stick');let jid=null;function jm(e){let r=j.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),mm=Math.hypot(dx,dy),max=38;if(mm>max){dx*=max/mm;dy*=max/mm}joy.x=dx/max;joy.y=dy/max;st.style.transform=`translate(${dx}px,${dy}px)`;e.preventDefault()}j.addEventListener('pointerdown',e=>{jid=e.pointerId;try{j.setPointerCapture(jid)}catch{}jm(e)},{passive:false});j.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)},{passive:false});['pointerup','pointercancel'].forEach(k=>j.addEventListener(k,e=>{if(jid===null||e.pointerId===jid){jid=null;joy.x=joy.y=0;st.style.transform='translate(0,0)'}e.preventDefault()},{passive:false}));document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>Object.assign(cam,presets[b.dataset.p]));document.getElementById('reset').onclick=()=>Object.assign(cam,{x:1.58,y:.48,yaw:Math.PI/2,pitch:0});document.getElementById('grid').onclick=()=>grid=!grid;document.getElementById('mapBtn').onclick=()=>mapOn=!mapOn;document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false})})();</script></body></html>
