name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir _site
          rsync -a --exclude '_site' --exclude '.git' ./ _site/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text()
          if 'responsive-v5.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="responsive-v5.css"></head>')
          if 'responsive-v5.js' not in s:
              s = s.replace('</body>', '<script src="responsive-v5.js"></script></body>')
          p.write_text(s)
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
